  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))E("Enter a valid email");
  if(!name)E("Enter your name");if(clip(b.password,200).length<6)E("Password must be at least 6 characters");
  if(db.users[email])E("An account with this email already exists",409);
  const nu=db.users[email]={name,email,pw:await hashPw(b.password),pid:"DEMO-"+Math.floor(1000+Math.random()*9000)};
  seedUser(nu);saveDb();return{token:btoa(email)};}
 if(m==="POST"&&path==="/login"){
  const x=db.users[clip(b.email,120).trim().toLowerCase()];
  if(!x||(await hashPw(clip(b.password,200),x.pw.split(":")[0]))!==x.pw)E("Wrong email or password",401);
  return{token:btoa(x.email)};}
 if(!u){if(st.stage==="app"){logout();}E("Please sign in again",401);}
 if(m==="GET"&&path==="/state")return viewOf(u);
 if(m==="POST"&&path==="/appts"){
  const d=DN[b.d];
  if(!d||!d[1].includes(b.time)||!/^\d{4}-\d{2}-\d{2}$/.test(b.date)||b.date<=day(0))E("Invalid appointment details");
  if(slotTaken(b.d,b.date,b.time))E("That time was just taken. Please pick another.",409);
  const a={id:"PF-"+Math.floor(100000+Math.random()*900000),d:b.d,date:b.date,time:b.time,status:"Upcoming",acc:(Array.isArray(b.acc)?b.acc:[]).slice(0,6).map(x=>clip(x,40)),reason:clip(b.reason,160)};
  u.appts.unshift(a);note(u,"Appointment confirmed","Demo booking with "+d[0]+" on "+fmtDate(a.date)+", "+a.time);saveDb();
  return{appt:a,appts:u.appts,notifs:u.notifs};}
 let r;
 if(m==="PATCH"&&(r=path.match(/^\/appts\/([\w-]+)$/))){
  const a=u.appts.find(x=>x.id===r[1]);if(!a)E("Not found",404);
  if(a.status!=="Upcoming")E("Only upcoming appointments can be changed");
  if(b.status==="Cancelled"){a.status="Cancelled";note(u,"Appointment cancelled","Your visit with "+DN[a.d][0]+" was cancelled.");}
  else if(b.date&&b.time){
   if(!DN[a.d][1].includes(b.time)||!/^\d{4}-\d{2}-\d{2}$/.test(b.date)||b.date<=day(0))E("Invalid appointment details");
   if(slotTaken(a.d,b.date,b.time,a.id))E("That time is already booked",409);
   a.date=b.date;a.time=b.time;note(u,"Appointment rescheduled","Moved to "+fmtDate(a.date)+", "+a.time);
  }else E("Nothing to change");
  saveDb();return{appts:u.appts,notifs:u.notifs};}
 if(m==="POST"&&path==="/notifs/read"){u.notifs.forEach(n=>{if(!b.id||String(n.id)===String(b.id))n.read=true;});saveDb();return{ok:true};}
 if(m==="DELETE"&&path==="/notifs"){u.notifs=[];saveDb();return{ok:true};}
 if(m==="POST"&&path==="/docs"){
  const f=o.body,name=clip(decodeURIComponent(o.headers["x-filename"]),120),cat=decodeURIComponent(o.headers["x-category"]);
  if(!CATS.includes(cat))E("Invalid category");if(f.size>10*1024*1024)E("File too large (10 MB max)",413);
  const id=Date.now()+Math.floor(Math.random()*1000);

  saveDb();return{docs:viewOf(u).docs};}
 if(m==="POST"&&path==="/reviews"){
  const text=clip(b.text,300).trim(),stars=Math.round(Number(b.stars));
  if(text.length<5||!(stars>=1&&stars<=5)||!clip(b.target,80))E("Please write a few words and choose a rating");

 if(m==="POST"&&path==="/chat")return{reply:getReply(clip(b.message,500))};
 E("Not found",404);}

function discoverData(){
 const text=P.search.toLowerCase(),mapped=[];
 for(const w in ALIAS)if(text.includes(w))mapped.push(ALIAS[w]);
 function pass(h,reasons,hasLang,hasSlots,hasSpec){
  if(P.locText!==""&&!h.loc.toLowerCase().includes(P.locText.toLowerCase()))return false;
  if(P.location!==""&&h.loc!==P.location)return false;
  if(P.spec!==""){if(!hasSpec)return false;reasons.push("Matches the selected specialty");}
  if(P.language!==""){if(!hasLang)return false;reasons.push("Offers "+P.language);}
  if(P.avail){if(!hasSlots)return false;reasons.push("Has available appointment slots");}
  if(P.acc!==""){if(h.access[ACCESS.indexOf(P.acc)]!=="verified")return false;reasons.push("Provides "+P.acc.toLowerCase()+" (verified)");}
  if(h.loc===st.loc)reasons.push("Located near "+st.loc);
  return true;
 }
 const dr=[],hr=[];
 for(const d of DOCS){const h=hosp(d.h),reasons=[];
  if(text!==""){let f=false;
   if(d.name.toLowerCase().includes(text)){f=true;reasons.push("Name matches your search");}
   if(d.spec.toLowerCase().includes(text)||mapped.includes(d.spec)){f=true;reasons.push("Matches the specialty you searched");}
   if(h.name.toLowerCase().includes(text)){f=true;reasons.push("Works at a hospital matching your search");}
   if(!f)continue;}
  if(pass(h,reasons,d.langs.includes(P.language),d.slots.length>0,d.spec===P.spec))dr.push({doctor:d,hospital:h,reasons});}
 for(const h of HOSP){const here=DOCS.filter(d=>d.h===h.id),reasons=[];
  if(text!==""){let f=false;
   if(h.name.toLowerCase().includes(text)){f=true;reasons.push("Name matches your search");}
   for(const s of h.specs){if(s.toLowerCase().includes(text)||mapped.includes(s)){f=true;reasons.push("Offers the specialty you searched");break;}}
   if(!f)continue;}
  if(pass(h,reasons,here.some(d=>d.langs.includes(P.language)),here.some(d=>d.slots.length>0),h.specs.includes(P.spec)))hr.push({hospital:h,reasons});}
 return{dr,hr};
}

  <p><small>Services: ${r.hospital.services.join(", ")}</small></p>

 const taken=slot=>st.appts.some(a=>a.d===b.d&&a.date===b.date&&a.time===slot&&a.status==="Upcoming");

  <div class="row"><button class="btn" data-a="viewappts">View my appointments</button><button class="btn ghost" data-a="go" data-v="dash">Back to dashboard</button></div></div>`;}
 const can=[b.h!=="",b.d!=="",b.date!=="",b.time!=="",b.reason.trim().length>2,true,true][b.step];
 let body="";
 if(b.step===0)body=`<h3>Select a hospital</h3>${HOSP.map(x=>`<button class="${b.h===x.id?"opt on":"opt"}" data-a="bh" data-v="${x.id}"><b>${x.name}</b><br><small>${x.loc} · ${x.specs.join(", ")}</small></button>`).join("")}`;

const SUGGESTIONS=["How can I find a nearby hospital?","How do I book an appointment?","What documents should I carry?","How can I reschedule an appointment?","How do I find a doctor who speaks my language?"];
const MEDICAL_WORDS=["diagnos","medicine","tablet","drug","dose","prescri","symptom","pain","fever","treatment","cure","disease"];
function getReply(q){
 const t=q.toLowerCase();
 for(const w of MEDICAL_WORDS)if(t.includes(w))return"I can't help with medical questions such as diagnosis, medicines or treatment. Please speak with a qualified healthcare professional. I can help you find a hospital or book a visit.";
 if(t.includes("resched"))return"Go to My Appointments, choose Reschedule on an upcoming appointment, then pick a new date and time slot.";
 if(t.includes("book")||t.includes("appointment"))return"Pick a doctor in Find Hospitals & Doctors and press Book Appointment. You will choose a date, a time and accessibility needs, then review and confirm.";
 if(t.includes("near")||t.includes("hospital"))return"Open Find Hospitals & Doctors, use Change Location under the search bar, then filter by specialty or accessibility. Each result explains why it appears.";
 if(t.includes("document")||t.includes("carry")||t.includes("bring"))return"Hospitals often ask for a photo ID, a referral letter if you have one, earlier reports or prescriptions, and insurance details. Check with your hospital for its exact list.";
 if(t.includes("language")||t.includes("speak"))return"In Find Hospitals & Doctors, set the Language filter. Each doctor card lists the languages they speak.";
 return"I can help you find facilities, understand booking steps and know which documents to carry. Try one of the suggested questions.";
}
function sendMessage(text){
 if(text.trim()===""||P.typing)return;
 const p=P;p.msgs.push({from:"me",text});p.input="";p.typing=true;render();
 api("/chat",{method:"POST",body:{message:text}}).then(r=>r.reply,()=>getReply(text)).then(rep=>setTimeout(()=>{p.msgs.push({from:"bot",text:rep});p.typing=false;if(P===p)render();},900));
}

 large:()=>{st.look={...st.look,large:!st.look.large};applyLook();},
 contrast:()=>{st.look={...st.look,contrast:!st.look.contrast};applyLook();},
 cmp:el=>{const id=el.dataset.v;if(P.cmp.includes(id))P.cmp=P.cmp.filter(x=>x!==id);else if(P.cmp.length>=2)toast("You can compare up to 2 items.");else P.cmp=[...P.cmp,id];},
 bacc:el=>{const n=el.dataset.v;P.acc=P.acc.includes(n)?P.acc.filter(x=>x!==n):[...P.acc,n];},
 files:el=>{const fs=[...el.files],cat=P.newCat;el.value="";
  (async()=>{try{let r;for(const f of fs)r=await api("/docs",{method:"POST",raw:true,body:f,headers:{"x-filename":encodeURIComponent(f.name),"x-category":encodeURIComponent(cat),"Content-Type":"application/octet-stream"}});
   if(r){st.docs=r.docs;toast("Saved to your Health Drive.");}}catch(e){toast(e.message);}render();})();},
};
const FORM={
 dsearch:()=>{st.query=P.search;go("find");},
 chat:()=>{sendMessage(P.input);return false;},
 review:()=>{
  if(P.text.trim().length<5){toast("Please write a few words first.");return false;}
  const p=P;api("/reviews",{method:"POST",body:{target:P.target,stars:P.stars,text:P.text}}).then(r=>{st.reviews=r.reviews;p.reviews=r.reviews;p.text="";toast("Review saved");render();}).catch(e=>toast(e.message));return false;},
 auth:f=>{doAuth(f);return false;},
};
document.addEventListener("click",e=>{
 const el=e.target.closest("[data-a]");if(!el)return;
 const f=ACT[el.dataset.a];if(f&&f(el.dataset.v,el,e)!==false)render();
});
document.addEventListener("input",e=>{
 const el=e.target,d=el.dataset;
 if(d.i){if(INP[d.i]){INP[d.i](el);if(d.i!=="files"||true)render();}return;}
 if(d.p){P[d.p]=el.type==="checkbox"?el.checked:d.n?Number(el.value):el.value;render();}
});
document.addEventListener("submit",e=>{
 e.preventDefault();const f=FORM[e.target.dataset.f];if(f&&f(e.target)!==false)render();
});

// ===== START =====
applyLook();
render();
if(TOKEN)loadState().catch(()=>{TOKEN=null;writeSaved("pf_token",null);});
introTimer=setTimeout(finishIntro,4800);
</script>
</body>
</html>
